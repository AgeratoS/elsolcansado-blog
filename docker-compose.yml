services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    build:
      context: .
      dockerfile: wordpress/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"
    env_file:
      - .env.docker
    environment:
      WORDPRESS_DB_HOST: db
    volumes:
      - wp_data:/var/www/html
      - ./plugin/next-revalidate:/var/www/html/wp-content/plugins/next-revalidate
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db_data:
  wp_data:
